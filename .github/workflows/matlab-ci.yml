name: Signal Conditioning & ADC Unit Tests

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:
  
jobs:
  adc_test:
    name: ADC Verification
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT ADC REPOSITORY
      # ============================================================

      - name: Checkout ADC Repository
        uses: actions/checkout@v6

      # ============================================================
      # MATLAB ENVIRONMENT
      # ============================================================

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v3
        with:
          products: Signal_Processing_Toolbox
          cache: true

      # ============================================================
      # ADC VERIFICATION
      # ============================================================

      - name: Run ADC Tests
        uses: matlab-actions/run-command@v3
        with:
          command: ADCRunTests

      # ============================================================
      # TEST EVIDENCE
      # ============================================================

      - name: Upload ADC Test Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: adc-test-reports
          path: test-results/
          if-no-files-found: warn
          retention-days: 30
  # =======================================
  # ADC to System Integration Repo Trigger
  #========================================
  trigger_integration:
    name: Trigger System Integration
    needs: adc_test

    if: >
      needs.adc_test.result == 'success' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    steps:

      - name: Trigger System Integration CI
        env:
          DISPATCH_TOKEN: ${{ secrets.INTEGRATION_DISPATCH_TOKEN }}

        run: |
          curl --fail-with-body \
            -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $DISPATCH_TOKEN" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            https://api.github.com/repos/DamiProject/System-Integration-ADC-Polyphase-Decimation-Filter/dispatches \
            -d '{
              "event_type": "adc-updated",
              "client_payload": {
                "source_repository": "${{ github.repository }}",
                "source_sha": "${{ github.sha }}"
              }
            }'
